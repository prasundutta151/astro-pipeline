[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-pipeline"
version = "0.1.0"
description = "Generic CLI pipeline runner for astronomical data processing."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "astropy",
]

[project.scripts]
astro-pipeline = "astro_pipeline.cli:main"
